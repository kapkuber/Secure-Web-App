{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="auth-card">
    <h2>Change Password</h2>
    <form method="post" action="{{ url_for('change_password') }}" autocomplete="off">
        <div class="form-group">
            <label for="current_password">Current Password</label>
            <input type="password" id="current_password" name="current_password" required
                   maxlength="128">
        </div>
        <div class="form-group">
            <label for="new_password">New Password</label>
            <input type="password" id="new_password" name="new_password" required
                   minlength="12" maxlength="128">
            <small class="hint">Min 12 chars · uppercase · lowercase · digit · special (!@#$%^&amp;*)</small>
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirm New Password</label>
            <input type="password" id="confirm_password" name="confirm_password" required
                   minlength="12" maxlength="128">
        </div>
        <button type="submit" class="btn btn-primary">Change Password</button>
    </form>
    <p class="form-footer"><a href="{{ url_for('dashboard') }}">Back to Dashboard</a></p>
</div>
{% endblock %}
