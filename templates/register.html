{% extends "base.html" %}
{% block title %}Register — SecureWebApp{% endblock %}
{% block content %}
<div class="auth-card">
    <h2>Create Account</h2>
    <form method="post" action="{{ url_for('register') }}" autocomplete="off">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required
                   pattern="[a-zA-Z0-9_]{3,20}" maxlength="20"
                   title="3–20 characters: letters, numbers, underscore">
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required
                   maxlength="254" autocomplete="email">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required
                   minlength="12" maxlength="128">
            <small class="hint">Min 12 chars · uppercase · lowercase · digit · special (!@#$%^&amp;*)</small>
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" required
                   minlength="12" maxlength="128">
        </div>
        <button type="submit" class="btn btn-primary">Register</button>
    </form>
    <p class="form-footer">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
</div>
{% endblock %}
