{% extends "base.html" %}
{% block title %}Share Document{% endblock %}
{% block content %}
<div class="auth-card">
    <h2>Share Document</h2>
    <form method="post" action="{{ url_for('share_document', doc_id=doc_id) }}">
        <div class="form-group">
            <label for="username">Share with (username)</label>
            <input type="text" id="username" name="username" required
                   maxlength="20" autocomplete="off">
        </div>
        <div class="form-group">
            <label for="role">Permission</label>
            <select id="role" name="role">
                <option value="viewer" selected>Viewer — download only</option>
                <option value="editor">Editor — download + upload new versions</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Share</button>
        <a href="{{ url_for('dashboard') }}" class="btn">Cancel</a>
    </form>
</div>
{% endblock %}
